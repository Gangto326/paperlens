<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; worker-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PaperLens</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="topbar">
        <button id="btn-open" type="button">PDF 열기</button>
        <span id="doc-title" class="muted">열린 문서 없음</span>
        <span class="spacer"></span>
        <button id="btn-zoom-out" type="button" aria-label="축소">−</button>
        <span id="zoom-label">125%</span>
        <button id="btn-zoom-in" type="button" aria-label="확대">+</button>
        <span id="stage" class="muted"></span>
        <button id="btn-process" type="button" hidden>번역 시작</button>
      </header>
      <main id="layout">
        <section id="viewer" aria-label="원문 뷰어"></section>
        <aside id="panel" aria-label="번역·해설 패널">
          <div id="account" aria-label="LLM 계정"></div>
          <section id="checks" aria-label="의존 서비스 점검"></section>
          <p id="status" class="muted">초기화 중…</p>
          <section id="overview" aria-label="논문 개요·용어집·개념 카드" hidden></section>
          <section id="selection" aria-label="선택한 문장"></section>
        </aside>
      </main>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
